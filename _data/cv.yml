    Publications:
      - title: Regulating the Nano–Bio Interface| Converging Electrochemical and Photonic Biosensing for Wearable Diagnostics
        authors:
          - V Kamat, K Xu, H An, Y Du, SM Weiss, S Bhansali
        publisher: Nano Letters
        releaseDate: 2026
        url: https://doi.org/10.1021/acs.nanolett.6c00860
        summary: This mini-review highlights the convergence of electrochemical and photonic biosensing as a systems-level strategy for wearable diagnostics, where complementary electrical and optical signals probe the same dynamic nano–bio interface.

      - title: Porous silicon on paper| A platform for quantitative rapid diagnostic tests
        authors:
          - H An, SJ Ward, R Layouni, PE Laibinis, AK Locke, SM Weiss
        publisher: ACS Applied Materials & Interfaces
        releaseDate: 2025
        url: https://doi.org/10.1021/acsami.4c18940
        summary: The first integration of open-ended porous silicon membranes with paper substrates enables pump-free flow-through biosensing, improving molecular transport and producing concentration-dependent optical responses for protein detection.

      - title: Porous silicon-on-paper sensors| factors affecting biosensing performance
        authors:
          - H An, PE Laibinis, AK Locke, SM Weiss
        publisher: SPIE Frontiers in Biological Detection
        releaseDate: 2025
        url: https://doi.org/10.1117/12.3048667
        summary: A paper-based porous silicon biosensor improves molecular transport and enables enhanced quantitative protein detection compared with conventional PSi films on silicon. By tuning wicking and absorbent paper layers, the platform can control incubation and testing time, supporting low-cost, sensitive rapid diagnostics.

      - title: Vacuum-filtration fabrication for diverse conductive transparent cellulose electronic devices
        authors:
          - S Noh, H An, Y Song
        publisher: Cellulose
        releaseDate: 2021
        url: https://link.springer.com/article/10.1007/s10570-021-03708-x
        summary: Develop a simple filtration and solvent-evaporation method to fabricate transparent conductive nitrocellulose electrodes, using carbon nanomaterials or silver nanowires, for touch sensors and paper-based electronic devices.

