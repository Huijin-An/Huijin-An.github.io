  summary: Ph.D. candidate specializing in diagnostic platform development, with expertise in optical biosensors, microfluidics, immunoassays, and micro/nanofabrication. Developed and optimized quantitative point-of-care sensing platforms by integrating sensor fabrication, surface biofunctionalization, assay development, and optical readout. Combines hands-on diagnostic R&D with NSF I-Corps experience in customer discovery and market validation to support translation of emerging technologies toward commercially relevant healthcare applications.

